version: '3.3'

services:
  # Mint Lookup Service Container
  mint:
    build: .
    ports:
      - '8000:8000'
    command: /app/mint server -c /app/configs/config.dist.yml
    environment:
      - APP_MODE=${APP_MODE:-prod}
      - APP_DATABASE_DRIVER=${DATABASE_DRIVER:-mysql}
      - APP_DATABASE_MYSQL_HOST=database
      - APP_DATABASE_MYSQL_PORT=3306
      - APP_DATABASE_MYSQL_DATABASE=${MYSQL_DATABASE:-mint}
      - APP_DATABASE_MYSQL_USERNAME=${MYSQL_USERNAME:-mint}
      - APP_DATABASE_MYSQL_PASSWORD=${MYSQL_PASSWORD:-mint}
      - APP_LOG_LEVEL=${LOG_LEVEL:-info}
      - APP_LOG_OUTPUT=${LOG_OUTPUT:-/app/var/logs/prod.log}
      - APP_LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_configs:/app/configs
      - app_var:/app/var
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MySQL Database Container
  database:
    image: 'mysql:26.10'
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mint}
      - MYSQL_USER=${MYSQL_USERNAME:-mint}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mint}
      - MYSQL_ALLOW_EMPTY_PASSWORD=no
    restart: unless-stopped
    healthcheck:
      test: '/usr/bin/mysql --user=root --password=root --execute "SHOW DATABASES;"'
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: null
  app_configs: null
  app_var: null
