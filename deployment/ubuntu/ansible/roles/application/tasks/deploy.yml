---
- name: Remove latest release
  file:
    path: /srv/app/releases/{{ app_version }}
    state: absent
  tags: [ deploy ]

- name: Ensure latest release directory exists
  file:
    path: /srv/app/releases/{{ app_version }}
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
    state: directory
  tags: [ deploy ]

- name: Clone mint into latest release directory
  ansible.builtin.unarchive:
    src: "{{ download_link }}"
    dest: /srv/app/releases/{{ app_version }}
    remote_src: yes
  tags: [ deploy ]

- name: Create config file
  template:
    src: config.prod.yml.j2
    dest: /srv/app/releases/{{ app_version }}/config.prod.yml
    mode: '0755'
  tags: [ deploy ]

- name: Create mint service file
  template:
    src: mint.service.j2
    dest: /etc/systemd/system/mint.service
    mode: "0750"
  notify: reload mint service
  tags: [ deploy ]

- name: Enable and start mint service
  systemd:
    name: mint
    state: started
    enabled: yes
  tags: [ deploy ]

- name: Update current release symlink
  file:
    src: /srv/app/releases/{{ app_version }}
    dest: /srv/app/current
    state: link
  notify: reload mint service
  tags: [ deploy ]

- name: Update release owner and permissions
  file:
    dest: /srv/app/releases/{{ app_version }}
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
    recurse: yes
  tags: [ deploy ]

- name: Update current release owner and permissions
  file:
    dest: /srv/app/current
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  tags: [ deploy ]

- name: Update logs owner and permissions
  file:
    dest: /srv/app/shared/logs
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
    recurse: yes
  tags: [ deploy ]
